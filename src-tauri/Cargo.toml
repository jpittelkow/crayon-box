[package]
name = "crayon-box"
version = "0.1.0"
description = "A touch-screen coloring app for kids aged 4 and under."
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# The Windows shell around the web app (ADR 0002). Kept thin: window, installer, and later the OS bridge.
# Built only in CI (docs/milestone-2.md, phase A); the dev machine has no Rust.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Files for storage and finished pictures (phase B); "Open the pictures folder" in the parent area.
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# In-app updates from GitHub Releases (ADR 0009, phase E): signed downloads, checked against the public key in
# tauri.conf.json.
tauri-plugin-updater = "2"
# The `plugins` section of tauri.conf.json is compiled in by `generate_context!`, which needs serde_json here.
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
