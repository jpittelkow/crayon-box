<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vehicle sources</title>
    <style>
      html, body { margin: 0; background: #1d2733; font: 13px/1.4 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #panel { position: fixed; left: 8px; top: 8px; max-width: min(820px, calc(100vw - 16px)); background: rgb(255 255 255 / 0.88);
        color: #1d2733; padding: 8px 12px; border-radius: 8px; }
      #panel h1 { font-size: 15px; margin: 0 0 4px; }
      #panel p { margin: 0 0 6px; }
      #panel table { border-collapse: collapse; }
      #panel td, #panel th { padding: 2px 8px 2px 0; text-align: left; white-space: nowrap; }
      #panel a { color: #1452c8; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">Loading…</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
