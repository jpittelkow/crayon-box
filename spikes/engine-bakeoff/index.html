<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>three.js or Babylon.js: the same drive, drawn twice</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2733; color: #f1f3f6;
        font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; -webkit-user-select: none; user-select: none; }
      #stage { position: fixed; inset: 0; display: flex; gap: 4px; touch-action: none; }
      .pane { position: relative; flex: 1 1 0; min-width: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .tag { position: absolute; left: 12px; bottom: 12px; padding: 4px 10px; border-radius: 8px;
        background: rgba(29, 39, 51, 0.8); font-weight: 600; pointer-events: none; }
      #panel { position: fixed; top: 10px; left: 10px; max-width: min(900px, calc(100vw - 20px)); padding: 10px 12px;
        border-radius: 10px; background: rgba(29, 39, 51, 0.88); }
      #panel[hidden] { display: none; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; }
      .row b { min-width: 110px; font-weight: 600; }
      .row b.gap { margin-left: 16px; min-width: 0; }
      a, button { font: inherit; color: #f1f3f6; background: #33414f; border: 0; border-radius: 6px; padding: 5px 10px;
        text-decoration: none; cursor: pointer; }
      a.on { background: #2457d6; }
      button:disabled { opacity: 0.6; }
      .hint { opacity: 0.75; }
      .stats { font-variant-numeric: tabular-nums; opacity: 0.9; }
      table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
      th, td { padding: 3px 9px; text-align: right; border-top: 1px solid #3b4a5a; }
      th:first-child, td:first-child { text-align: left; }
      #horn { position: fixed; right: 20px; bottom: 20px; width: 104px; height: 104px; border-radius: 24px;
        border: 5px solid #23201c; background: #ffd23f; box-shadow: 0 6px 0 #23201c; font-size: 44px; padding: 0; }
      #horn:active { transform: translateY(6px); box-shadow: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel"></div>
    <button id="horn" aria-label="Horn">📯</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
