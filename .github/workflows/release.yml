name: Release

# ADR 0009: pushing a version tag (`v0.1.0`) builds the Windows installer into a **draft** GitHub Release. A parent
# installs the draft, then publishes it by hand; nothing reaches the family laptop on its own.
# For now the installer is unsigned and there is no updater: phase E of docs/milestone-2.md adds the update
# signature and `latest.json` to this same workflow.
#
# To release: bump "version" in package.json on main, then
#   git tag v<version> && git push origin v<version>

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tauri build --bundles nsis
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe \
            --draft --verify-tag --generate-notes \
            --title "Crayon Box ${GITHUB_REF_NAME#v}" \
            --notes "Windows installer, per-user (no admin rights needed). Not code-signed yet: Windows SmartScreen asks first; choose More info, then Run anyway."
