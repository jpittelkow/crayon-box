<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 680" font-family="Segoe UI, Arial, sans-serif">
  <title>Island layout A: a loop and a shortcut</title>
  <defs>
    <pattern id="waves" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q10 4 20 10 T40 10" fill="none" stroke="#7cc4f2" stroke-width="2" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- Sea -->
  <rect width="900" height="680" fill="#3d9fe0"/>
  <rect width="900" height="680" fill="url(#waves)"/>
  <!-- Island: sand band, then grass. A bay cuts in from the east. -->
  <path id="land" d="M 120 340 C 120 170 300 90 470 90 C 640 90 780 160 800 250 L 640 295 C 620 310 620 340 640 355 L 800 400 C 790 510 640 600 460 600 C 280 600 120 510 120 340 Z"
        fill="#e6c98c" stroke="#e6c98c" stroke-width="28" stroke-linejoin="round"/>
  <path d="M 120 340 C 120 170 300 90 470 90 C 640 90 780 160 800 250 L 640 295 C 620 310 620 340 640 355 L 800 400 C 790 510 640 600 460 600 C 280 600 120 510 120 340 Z"
        fill="#6fb84a"/>
  <!-- The beach: a wide sandy stretch on the south coast -->
  <path d="M 250 545 C 330 590 420 606 520 600 C 600 596 660 575 700 548 L 690 520 C 620 560 520 575 440 570 C 360 565 300 545 262 520 Z" fill="#ecd29a"/>
  <text x="470" y="590" font-size="15" fill="#8a6d2e" text-anchor="middle">beach</text>
  <!-- Hill with the tunnel -->
  <ellipse cx="460" cy="310" rx="82" ry="62" fill="#4f8f3a"/>
  <ellipse cx="460" cy="302" rx="58" ry="40" fill="#5ea347"/>
  <!-- Trees -->
  <g fill="#2f7a35">
    <circle cx="300" cy="140" r="9"/><circle cx="330" cy="125" r="7"/><circle cx="600" cy="125" r="9"/><circle cx="640" cy="140" r="7"/>
    <circle cx="180" cy="300" r="8"/><circle cx="175" cy="400" r="9"/><circle cx="330" cy="260" r="8"/><circle cx="580" cy="400" r="8"/>
    <circle cx="350" cy="420" r="9"/><circle cx="590" cy="230" r="7"/><circle cx="740" cy="470" r="8"/><circle cx="720" cy="190" r="8"/>
  </g>
  <!-- Roads: the loop, and the shortcut through the hill -->
  <g fill="none" stroke-linecap="round">
    <path id="loop" d="M 230 340 C 230 210 340 160 460 160 C 600 160 700 210 700 340 C 700 470 600 530 460 530 C 320 530 230 470 230 340 Z" stroke="#5a5f66" stroke-width="26"/>
    <path d="M 460 160 L 460 530" stroke="#5a5f66" stroke-width="26"/>
    <path d="M 230 340 C 230 210 340 160 460 160 C 600 160 700 210 700 340 C 700 470 600 530 460 530 C 320 530 230 470 230 340 Z" stroke="#fff" stroke-width="2" stroke-dasharray="10 10"/>
    <path d="M 460 160 L 460 530" stroke="#fff" stroke-width="2" stroke-dasharray="10 10"/>
  </g>
  <!-- Tunnel: the hill covers the shortcut; portals at each end -->
  <ellipse cx="460" cy="310" rx="56" ry="38" fill="#5ea347" opacity="0.92"/>
  <rect x="444" y="262" width="32" height="12" rx="6" fill="#2b2b2b"/>
  <rect x="444" y="346" width="32" height="12" rx="6" fill="#2b2b2b"/>
  <!-- Bridge over the bay -->
  <rect x="684" y="262" width="32" height="112" fill="#c98b4a"/>
  <line x1="684" y1="262" x2="684" y2="374" stroke="#7a4f22" stroke-width="4"/>
  <line x1="716" y1="262" x2="716" y2="374" stroke="#7a4f22" stroke-width="4"/>
  <!-- The flood across the loop (north-west), puddles -->
  <ellipse cx="300" cy="200" rx="46" ry="34" fill="#2f8fd0" opacity="0.9"/>
  <g fill="#2f8fd0" opacity="0.85">
    <ellipse cx="610" cy="170" rx="12" ry="8"/><ellipse cx="660" cy="470" rx="13" ry="9"/><ellipse cx="340" cy="510" rx="12" ry="8"/><ellipse cx="236" cy="420" rx="10" ry="7"/>
  </g>
  <!-- Car wash on the shortcut -->
  <rect x="432" y="426" width="56" height="30" rx="5" fill="#f4f6f8" stroke="#e63946" stroke-width="4"/>
  <circle cx="450" cy="420" r="7" fill="#d8efff"/><circle cx="466" cy="416" r="9" fill="#d8efff"/>
  <!-- Ramp on the west of the loop -->
  <rect x="216" y="270" width="28" height="22" fill="#ffc83d"/>
  <path d="M 220 276 L 230 282 L 240 276 M 220 284 L 230 290 L 240 284" stroke="#e63946" stroke-width="3" fill="none"/>
  <!-- Animals that answer the horn: a little field in the north-east -->
  <g fill="#fff" stroke="#555" stroke-width="1.5"><circle cx="560" cy="250" r="7"/><circle cx="590" cy="265" r="7"/><circle cx="545" cy="275" r="6"/></g>
  <!-- Junctions -->
  <circle cx="460" cy="160" r="20" fill="none" stroke="#ff6b9d" stroke-width="4"/>
  <circle cx="460" cy="530" r="20" fill="none" stroke="#ff6b9d" stroke-width="4"/>
  <!-- Start -->
  <path d="M 300 497 l 6 13 14 1 -11 9 4 14 -13 -8 -13 8 4 -14 -11 -9 14 -1 Z" fill="#fff" stroke="#333" stroke-width="2"/>
  <!-- Number tags -->
  <g font-size="16" font-weight="700" text-anchor="middle">
    <g><circle cx="752" cy="318" r="15" fill="#fff"/><text x="752" y="324">1</text></g>
    <g><circle cx="540" cy="312" r="15" fill="#fff"/><text x="540" y="318">2</text></g>
    <g><circle cx="510" cy="441" r="15" fill="#fff"/><text x="510" y="447">3</text></g>
    <g><circle cx="190" cy="270" r="15" fill="#fff"/><text x="190" y="276">4</text></g>
    <g><circle cx="300" cy="200" r="15" fill="#fff"/><text x="300" y="206">5</text></g>
    <g><circle cx="610" cy="560" r="15" fill="#fff"/><text x="610" y="566">6</text></g>
    <g><circle cx="615" cy="280" r="15" fill="#fff"/><text x="615" y="286">7</text></g>
    <g><circle cx="500" cy="160" r="15" fill="#fff"/><text x="500" y="166">8</text></g>
  </g>
  <!-- Legend -->
  <rect x="900" width="280" height="680" fill="#fffaf0"/>
  <g font-size="17" fill="#222">
    <text x="924" y="48" font-size="24" font-weight="700">Layout A</text>
    <text x="924" y="76" font-size="17" fill="#555">A loop and a shortcut</text>
    <text x="924" y="128">1  Bridge over a bay</text>
    <text x="924" y="160">2  Tunnel through the hill</text>
    <text x="924" y="192">3  Car wash</text>
    <text x="924" y="224">4  Ramp</text>
    <text x="924" y="256">5  The flood</text>
    <text x="924" y="288">6  Beach</text>
    <text x="924" y="320">7  Animals (answer the horn)</text>
    <text x="924" y="352">8  Junctions (pink rings)</text>
    <text x="924" y="384">★  Where the car starts</text>
  </g>
  <g font-size="15" fill="#444">
    <text x="924" y="440">About the size of today's island.</text>
    <text x="924" y="464">Two ways round: the loop, or</text>
    <text x="924" y="486">through the hill.</text>
    <text x="924" y="520">Traffic and "follows the road"</text>
    <text x="924" y="542">pick a way at each junction.</text>
    <text x="924" y="576">More to explore; a little more</text>
    <text x="924" y="598">to build (junctions).</text>
  </g>
</svg>
